[project]
name = "splitlab"
version = "0.1.0"
description = "Analyse vidéo automatisée de course de natation (50 NL, bassin de 25 m)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.0",
    "opencv-python-headless>=5.0.0.93",
    "scipy>=1.14",
    "ultralytics>=8.4.163",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "scipy-stubs>=1.18.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY"]
# Typographie des formules dans les commentaires en français
allowed-confusables = ["−", "×", "–", "’"]

[tool.mypy]
python_version = "3.12"
strict = true
